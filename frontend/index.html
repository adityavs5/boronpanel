<html lang="en" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#111827" />
    <title>Forgehost</title>
    <style>
      /* First-paint background while the JS bundle loads, so a hard refresh

      html.dark { background: #111827; } /* gray-900, matches index.css --bg dark */
    </style>
    <script src="/static/dist/theme-init.js"></script>
  </head>
  <body class="h-full">
    <div id="root" class="h-full"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
