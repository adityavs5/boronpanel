{% extends "base.html" %}
{% block title %}Two-factor authentication - Forgehost{% endblock %}
{% block content %}
<div class="login-box card">
  <h2>Two-factor authentication</h2>
  <p class="muted">Enter the 6-digit code from your authenticator app, or one of your recovery codes.</p>
  {% if error %}<p class="error">{{ error }}</p>{% endif %}
  <form method="post" action="/login/2fa">
    <input type="hidden" name="pending_token" value="{{ pending_token }}">
    <p><input type="text" name="code" placeholder="Code" required autofocus style="width:100%"></p>
    <button type="submit" style="width:100%">Verify</button>
  </form>
</div>
{% endblock %}
