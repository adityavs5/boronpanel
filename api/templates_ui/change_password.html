{% extends "base.html" %}
{% block title %}Change password - Forgehost{% endblock %}
{% block content %}
<div class="login-box card">
  <h2>Change password</h2>
  <p class="muted">Changes the login password for <strong>{{ identity.username }}</strong>.</p>
  {% if error %}<p class="error">{{ error }}</p>{% endif %}
  {% if success %}<p class="status active">Password changed.</p>{% endif %}
  <form method="post" action="/change-password">
    <p><input type="password" name="current_password" placeholder="Current password" required style="width:100%"></p>
    <p><input type="password" name="new_password" placeholder="New password (12+ chars, upper/lower/number/special)" required minlength="12" style="width:100%"></p>
    <p><input type="password" name="confirm_password" placeholder="Confirm new password" required minlength="12" style="width:100%"></p>
    <button type="submit" style="width:100%">Change password</button>
  </form>
</div>
{% endblock %}
