# License-gated release files on download.boronpanel.com. Rendered by
# install_server.sh into /etc/nginx/snippets/boron-download-protected.conf
# (0600 root, it holds the secret) and included from the download server's
# 443 block. Links come from POST https://license.boronpanel.com/v1/updates:
#   md5 = base64url(md5("$expires$uri$remote_addr <secret>")), valid 15 minutes
# and only for the address the license server saw ($remote_addr here is the
# Cloudflare-restored client address, as on the license host).
# ^~ keeps regex locations of the server block from matching these paths.
location ^~ /protected/ {
    root /srv/download;
    autoindex off;
    limit_except GET { deny all; }   # GET includes HEAD

    secure_link $arg_md5,$arg_expires;
    secure_link_md5 "$secure_link_expires$uri$remote_addr __DOWNLOAD_SECRET__";
    # "" = missing or wrong token, "0" = expired.
    if ($secure_link = "") { return 403; }
    if ($secure_link = "0") { return 410; }

    # Directories are never listed or served, only release files.
    location ~ /$ { return 403; }

    # Links are per client and short-lived: nothing may cache them. (Any
    # add_header here replaces the server block's, so HSTS is repeated.)
    add_header Cache-Control "private, no-store" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    default_type application/octet-stream;
    types { application/json json; }
    access_log /var/log/nginx/boron-download-protected.log;
}
