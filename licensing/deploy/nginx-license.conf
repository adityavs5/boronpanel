# license.boronpanel.com -> local license server. Included from the main site
# file; TLS settings and rate-limit zones live in conf.d/00-boron-common.conf.
server {
    listen 443 ssl http2;  listen [::]:443 ssl http2;
    server_name license.boronpanel.com;
    client_max_body_size 16k;
    limit_req zone=boron_api burst=20 nodelay;
    add_header X-Content-Type-Options nosniff always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Cache-Control "no-store" always;

    location / {
        proxy_pass http://127.0.0.1:8100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # $remote_addr is already the Cloudflare-restored client address.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For "";
        proxy_read_timeout 30s;
    }
}
