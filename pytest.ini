[pytest]
testpaths = tests
pythonpath = .
addopts = -rs -p testsupport.skip_report
# Successful test directories can be very large (backup/restore fixtures).
# The outer scripts/test_workspace.py wrapper retains the last three complete
# runs; inside each run pytest keeps only failed-test data.
tmp_path_retention_policy = failed
tmp_path_retention_count = 1
