<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>403 - Forbidden</title>
<style>
  :root { color-scheme: light dark; }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
    background:#0b1220; color:#e6edf3; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; }
  .card { text-align:center; padding:2.5rem; }
  .code { font-size:5rem; font-weight:700; letter-spacing:-0.03em; color:#f59e0b; margin:0; }
  h1 { font-size:1.4rem; font-weight:600; margin:0.5rem 0 0.75rem; }
  p { color:#8b98a5; max-width:32rem; margin:0 auto; line-height:1.5; }
</style>
</head>
<body>
  <div class="card">
    <p class="code">403</p>
    <h1>Access Forbidden</h1>
    <p>You don't have permission to access this resource.</p>
  </div>
</body>
</html>
